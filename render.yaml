# Render Blueprint: deploys the API (free web service) and the SPA (free static site).
# Database: free Postgres on Neon, connection string goes into DATABASE_URL.
services:
  - type: web
    name: slek-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build && cd build && npm ci --omit=dev
    startCommand: cd build && node ace migration:run --force && node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_KEY
        generateValue: true
      - key: DRIVE_DISK
        value: local
      - key: DB_CONNECTION
        value: pg
      - key: DATABASE_URL
        sync: false

  - type: web
    name: slek-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/spa
    routes:
      # vue-router runs in history mode
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        sync: false
